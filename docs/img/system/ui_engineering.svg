<svg xmlns="http://www.w3.org/2000/svg" width="260" height="110">
  <style>
    .text-base { font-family: 'Consolas', 'Courier New', monospace; }
    .box { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-opacity: 0.5; }
    .label { font-size: 8px; fill: #888888; letter-spacing: 1px; font-weight: bold;}
    .title { font-size: 16px; font-weight: bold; fill: #ffffff; }
    .desc { font-size: 9px; fill: #aaaaaa; }
    .pill { fill: none; stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.7; }
    .pill-text { font-size: 8px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .icon { stroke: #ffffff; stroke-width: 2; fill: none; }
  </style>
  <rect x="5" y="10" width="250" height="90" rx="10" class="box" />
  <rect x="25" y="35" width="30" height="40" rx="3" class="icon" />
  <rect x="25" y="35" width="30" height="10" rx="0" fill="#fff" />
  <circle cx="30" cy="40" r="2" fill="#000" />
  <circle cx="36" cy="40" r="2" fill="#000" />
  <text x="75" y="35" class="text-base label">INTERACTIVE EXPERIENCE</text>
  <text x="75" y="55" class="text-base title">UI ENGINEERING</text>
  <text x="75" y="70" class="text-base desc">Pixel-perfect interfaces.</text>
  <rect x="75" y="78" width="55" height="14" rx="7" class="pill" />
  <text x="102.5" y="88" class="text-base pill-text">TAILWIND</text>
  <rect x="135" y="78" width="45" height="14" rx="7" class="pill" />
  <text x="157.5" y="88" class="text-base pill-text">FIGMA</text>
</svg>
