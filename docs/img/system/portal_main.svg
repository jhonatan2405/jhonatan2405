<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200">
  <style>
    .text-base { font-family: 'Consolas', 'Courier New', monospace; }
    .box { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-opacity: 0.5; }
    .primary { font-size: 12px; fill: #888888; text-anchor: middle; letter-spacing: 2px; font-weight: bold;}
    .main-title { font-size: 36px; font-weight: 900; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
    .links { font-size: 14px; fill: #cccccc; text-anchor: middle; }
    .pill { fill: none; stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.7; }
    .pill-text { font-size: 10px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
  </style>
  <rect x="50" y="20" width="700" height="150" rx="15" class="box" />
  <path d="M 200,20 L 200,15 L 600,15 L 600,20" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <path d="M 200,170 L 200,175 L 600,175 L 600,170" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>
  <text x="400" y="60" class="text-base primary">PRIMARY PORTAL</text>
  <text x="400" y="105" class="text-base main-title">JHONATAN BARRERA</text>
  <text x="400" y="130" class="text-base links">Frontend Engineering | UI Architecture | Scalable Systems</text>
  <rect x="250" y="145" width="80" height="20" rx="10" class="pill" />
  <text x="290" y="158" class="text-base pill-text">PROJECTS</text>
  <rect x="340" y="145" width="60" height="20" rx="10" class="pill" />
  <text x="370" y="158" class="text-base pill-text">GITHUB</text>
  <rect x="410" y="145" width="60" height="20" rx="10" class="pill" />
  <text x="440" y="158" class="text-base pill-text">SKILLS</text>
  <rect x="480" y="145" width="80" height="20" rx="10" class="pill" />
  <text x="520" y="158" class="text-base pill-text">ABOUT</text>
</svg>
