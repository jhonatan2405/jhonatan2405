<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <style>
    .text-base { font-family: 'Consolas', 'Courier New', monospace; }
    .box { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-opacity: 0.6; }
    .title { font-size: 18px; font-weight: bold; fill: #ffffff; text-anchor: middle;}
    .desc { font-size: 10px; fill: #888888; text-anchor: middle;}
    .icon { fill: none; stroke: #ffffff; stroke-width: 2; }
  </style>
  <rect x="10" y="10" width="180" height="180" rx="10" class="box" />
  <circle cx="100" cy="80" r="30" class="icon"/>
  <circle cx="100" cy="80" r="10" fill="#ffffff"/>
  <path d="M 70,80 L 50,80 M 130,80 L 150,80 M 100,50 L 100,30 M 100,110 L 100,130" class="icon" stroke-opacity="0.5"/>
  <text x="100" y="150" class="text-base title">NETWORK NODE</text>
  <text x="100" y="170" class="text-base desc">Ready for connection</text>
</svg>
