<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350">
  <style>
    .text-base { font-family: 'Consolas', 'Courier New', monospace; }
    .bg { fill: none; stroke: #ffffff; stroke-width: 1; stroke-opacity: 0.2; }
    .main-title { font-size: 24px; font-weight: bold; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
    .subtitle { font-size: 10px; fill: #888888; text-anchor: middle; letter-spacing: 1px; }
    .box { fill: none; stroke: #ffffff; stroke-width: 1.5; stroke-opacity: 0.6; }
    .box-title { font-size: 18px; font-weight: bold; fill: #ffffff; }
    .box-subtitle { font-size: 10px; fill: #888888; }
    .bullet { fill: #ffffff; }
    .text { font-size: 12px; fill: #cccccc; }
    .icon { fill: none; stroke: #ffffff; stroke-width: 2; }
  </style>
  <rect x="20" y="20" width="760" height="310" rx="10" class="bg" />
  <circle cx="400" cy="50" r="15" class="icon" />
  <circle cx="400" cy="50" r="5" fill="#ffffff" />
  <path d="M 400,25 L 400,10 M 400,75 L 400,90 M 375,50 L 360,50 M 425,50 L 440,50" class="icon" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="400" y="85" class="text-base main-title">ENGINEERING CORE</text>
  <text x="400" y="105" class="text-base subtitle">capabilities * technical stack * mindset</text>
  <rect x="50" y="130" width="220" height="170" rx="10" class="box" />
  <text x="70" y="165" class="text-base box-title">BUILD SYSTEMS</text>
  <text x="70" y="180" class="text-base box-subtitle">Frontend Architecture</text>
  <circle cx="75" cy="210" r="3" class="bullet"/>
  <text x="85" y="214" class="text-base text">Scalable React Apps</text>
  <circle cx="75" cy="240" r="3" class="bullet"/>
  <text x="85" y="244" class="text-base text">Responsive UI/UX</text>
  <circle cx="75" cy="270" r="3" class="bullet"/>
  <text x="85" y="274" class="text-base text">State Management</text>
  <rect x="290" y="130" width="220" height="170" rx="10" class="box" />
  <text x="310" y="165" class="text-base box-title">INTERESTS</text>
  <text x="310" y="180" class="text-base box-subtitle">Patterns &amp; Backend</text>
  <circle cx="315" cy="210" r="3" class="bullet"/>
  <text x="325" y="214" class="text-base text">Advanced React</text>
  <circle cx="315" cy="240" r="3" class="bullet"/>
  <text x="325" y="244" class="text-base text">Modern Web Arch</text>
  <circle cx="315" cy="270" r="3" class="bullet"/>
  <text x="325" y="274" class="text-base text">Microservices</text>
  <rect x="530" y="130" width="220" height="170" rx="10" class="box" />
  <text x="550" y="165" class="text-base box-title">PHILOSOPHY</text>
  <text x="550" y="180" class="text-base box-subtitle">Engineering Mindset</text>
  <circle cx="555" cy="210" r="3" class="bullet"/>
  <text x="565" y="214" class="text-base text">Clean Code Rules</text>
  <circle cx="555" cy="240" r="3" class="bullet"/>
  <text x="565" y="244" class="text-base text">Always Learning</text>
  <circle cx="555" cy="270" r="3" class="bullet"/>
  <text x="565" y="274" class="text-base text">Systems &gt; Hacks</text>
</svg>
